name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.43

      - name: Setup mdbook-mermaid
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook-mermaid@0.16.2

      - name: Cache book artifacts
        uses: actions/cache@v4
        with:
          path: |
            book/book
            book/theme
          key: mdbook-${{ runner.os }}-${{ hashFiles('book/book.toml', 'book/src/SUMMARY.md', 'book/theme/custom.css') }}
          restore-keys: |
            mdbook-${{ runner.os }}-

      - name: Build book
        working-directory: book
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4